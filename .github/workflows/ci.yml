name: termination-engine CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Z3 4.12.2 native library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgomp1 unzip
          curl --fail --location --output /tmp/z3.zip \
            https://github.com/Z3Prover/z3/releases/download/z3-4.12.2/z3-4.12.2-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d /tmp/z3
          sudo install -m 755 /tmp/z3/z3-4.12.2-x64-glibc-2.35/bin/libz3.so /usr/local/lib/libz3.so
          sudo ldconfig

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/TerminationEngine.Tests.fsproj

      - name: Build
        run: dotnet build tests/TerminationEngine.Tests.fsproj --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/TerminationEngine.Tests.fsproj --configuration Release --no-build --no-restore
