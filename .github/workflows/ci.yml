name: termination-engine CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Z3 native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libz3-dev libgomp1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/TerminationEngine.Tests.fsproj

      - name: Build
        run: dotnet build tests/TerminationEngine.Tests.fsproj --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/TerminationEngine.Tests.fsproj --configuration Release --no-build --no-restore
